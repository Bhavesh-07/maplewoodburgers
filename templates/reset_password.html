<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Admin Portal</title>
    <link rel="stylesheet" href="/static/fonts/google-fonts/css/master-fonts.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box img {
            width: 200px;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #222;
        }

        p.desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #aa1e2d;
        }

        .login-btn {
            width: 100%;
            background: #aa1e2d;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #8e1925;
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
            display: none;
        }

        {% if error %}
        .server-error {
            display: block !important;
        }
        {% endif %}
    </style>
</head>

<body>
    <div class="login-box">
        <img src="/static/img/Maplewood-Burgers-Logo-Stacked.svg" alt="Maplewood Burgers">
        <h2>Reset Password</h2>
        <p class="desc">Set a new secure login password below.</p>

        <div class="error-msg server-error" id="error-block">
            <span id="error-text">{% if error %}{{ error }}{% endif %}</span>
        </div>

        <form action="/access-panel/reset-password" method="POST" id="reset-form">
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" id="new_password" required minlength="6" placeholder="Minimum 6 characters" autofocus>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required minlength="6" placeholder="Re-enter password">
            </div>

            <button type="submit" class="login-btn">Save New Password</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('reset-form');
            const newPwd = document.getElementById('new_password');
            const confirmPwd = document.getElementById('confirm_password');
            const errorBlock = document.getElementById('error-block');
            const errorText = document.getElementById('error-text');

            form.addEventListener('submit', (e) => {
                if (newPwd.value !== confirmPwd.value) {
                    e.preventDefault();
                    errorText.textContent = "Passwords do not match.";
                    errorBlock.style.display = "block";
                    confirmPwd.focus();
                }
            });

            confirmPwd.addEventListener('input', () => {
                if (confirmPwd.value && newPwd.value !== confirmPwd.value) {
                    errorText.textContent = "Passwords do not match.";
                    errorBlock.style.display = "block";
                } else {
                    errorBlock.style.display = "none";
                }
            });
        });
    </script>
</body>

</html>
