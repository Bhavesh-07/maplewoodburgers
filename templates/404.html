<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Devoured - 404 Not Found</title>
    <link rel="stylesheet" href="/static/fonts/google-fonts/css/master-fonts.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Pure CSS Animated Burger with a "Bite" taken out of it */
        .burger-illustration {
            width: 140px;
            height: 120px;
            margin: 0 auto 30px auto;
            position: relative;
            cursor: pointer;
            filter: drop-shadow(0 10px 20px rgba(239, 139, 34, 0.3));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .burger-illustration:hover {
            transform: scale(1.08) rotate(3deg);
        }

        .bun-top {
            width: 120px;
            height: 45px;
            background: #e69138;
            border-radius: 60px 60px 10px 10px;
            margin: 0 auto 4px auto;
            position: relative;
        }

        .sesame-seed {
            position: absolute;
            width: 4px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .s1 { top: 12px; left: 35px; }
        .s2 { top: 18px; left: 60px; }
        .s3 { top: 10px; left: 80px; }
        .s4 { top: 22px; left: 45px; }
        .s5 { top: 20px; left: 85px; }

        .lettuce {
            width: 130px;
            height: 10px;
            background: #6aa84f;
            border-radius: 5px;
            margin: 0 auto 3px auto;
        }

        .cheese {
            width: 124px;
            height: 6px;
            background: #f1c232;
            border-radius: 3px;
            margin: 0 auto 3px auto;
        }

        .patty {
            width: 120px;
            height: 24px;
            background: #783f04;
            border-radius: 8px;
            margin: 0 auto 4px auto;
        }

        .bun-bottom {
            width: 116px;
            height: 20px;
            background: #e69138;
            border-radius: 5px 5px 30px 30px;
            margin: 0 auto;
        }

        /* Bite effect - pure CSS cutout */
        .bite-cutout {
            position: absolute;
            top: 25px;
            right: 0px;
            width: 35px;
            height: 65px;
            background: radial-gradient(circle, transparent 20px, #1a1a1a 21px);
            z-index: 10;
            pointer-events: none;
        }
        
        .error-code {
            font-family: 'Oswald', sans-serif;
            font-size: 96px;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, #aa1e2d 0%, #ef8b22 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            animation: pulseGlow 3s infinite alternate;
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 24px;
            margin: 15px 0 10px 0;
            letter-spacing: 1px;
            color: #ef8b22;
        }

        p {
            font-size: 15px;
            color: #b3b3b3;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .home-btn {
            background: linear-gradient(135deg, #aa1e2d 0%, #8e1925 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(170, 30, 45, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(170, 30, 45, 0.5);
            background: linear-gradient(135deg, #c92f2f 0%, #aa1e2d 100%);
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Decorative background light */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(170, 30, 45, 0.15) 0%, transparent 70%);
            z-index: 1;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            from {
                filter: drop-shadow(0 0 10px rgba(239, 139, 34, 0.1));
            }
            to {
                filter: drop-shadow(0 0 25px rgba(170, 30, 45, 0.35));
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="burger-illustration">
            <div class="bun-top">
                <div class="sesame-seed s1"></div>
                <div class="sesame-seed s2"></div>
                <div class="sesame-seed s3"></div>
                <div class="sesame-seed s4"></div>
                <div class="sesame-seed s5"></div>
            </div>
            <div class="lettuce"></div>
            <div class="cheese"></div>
            <div class="patty"></div>
            <div class="bun-bottom"></div>
            <!-- Bite effect -->
            <div class="bite-cutout"></div>
        </div>

        <h1 class="error-code">404</h1>
        <h2>Whoops! Page Devoured.</h2>
        <p>It looks like someone took a bite out of this link! The page you are looking for has either been moved, deleted, or never existed.</p>
        
        <div class="btn-group">
            <a href="/" class="home-btn">Back to Home</a>
            <a href="/full-menu" class="menu-btn">View Menu</a>
        </div>
    </div>

    <!-- LeadConnector Chat Widget -->
    {% if settings.chat_widget_key %}
    <script>
    window.addEventListener("load", function () {
        var lc_location_id = "{{ settings.chat_widget_key }}";
        var settings = {
            "location-id": lc_location_id,
            "style": "--chat-widget-primary-color:#EF8B22; --chat-widget-active-color:#EF8B22; --chat-widget-bubble-color:#EF8B22",
            "prompt-msg": "Hi there, have a question? Text us here.",
            "heading": "Hi There! Have a question?",
            "sub-heading": "Please enter your question or message below and we will get right back to you.",
            "success-msg": "We'll be with you shortly!!",
            "thank-you-msg": "Thank You!",
            "legal-msg": "By submitting you agree to receive SMS or e-mails for the provided channel. Rates may be applied.",
            "show-prompt": "true",
            "auto-country-code": "true",
            "enable-revisit-message": "true",
            "revisit-prompt-msg": "Welcome back, how can we help you today?",
            "use-email-field": "false"
        };

        var textWidget = document.createElement("chat-widget");
        Object.keys(settings).forEach(function(key) {
            textWidget.setAttribute(key, settings[key]);
        });
        document.body.appendChild(textWidget);

        var moduleScript = document.createElement("script");
        moduleScript.src = "https://widgets.leadconnectorhq.com/loader.js";
        moduleScript.setAttribute("data-cdn-url", "https://widgets.leadconnectorhq.com");
        document.body.appendChild(moduleScript);
    });
    </script>
    {% endif %}
</body>

</html>
